<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaiShoes | Detalle</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="sytle.css" />
  </head>
  <body class="product-page-body">
    <div class="page-shell">
      <a id="volverProducto" href="catalogo.html" class="button primary"><span class="back-arrow" aria-hidden="true">←</span> Volver al catálogo</a>
      <main class="product-page">
        <section class="gallery-panel">
          <div class="gallery-frame">
            <img id="mainImage" class="main-image" src="" alt="Producto" />
          </div>
          <div id="gallery" class="thumbnail-row"></div>
        </section>

        <section class="info-panel">
          <h1 id="productoNombre"></h1>
          <p id="productoDescripcion" class="product-description"></p>

          <div class="price-row">
            <span id="productoPrecio" class="price"></span>
            <span id="estadoDisponibilidad" class="stock-status">Disponible</span>
          </div>

          <div class="option-block" id="selectorColor">
            <h3>Colores disponibles</h3>
            <div id="colores" class="swatch-row"></div>
            <p id="colorInfo" class="selection-info"></p>
          </div>

          <div class="option-block" id="selectorTalla">
            <h3>Selecciona tu talla</h3>
            <div id="tallas" class="size-selector"></div>
            <p id="tallaInfo" class="selection-info"></p>
          </div>

          <div class="detail-box">
            <h3>Detalle</h3>
            <p id="productoDetalle"></p>
          </div>

          <div class="actions">
            <button id="botonCompra" class="primary-button" type="button">Agregar a la simulación</button>
          </div>
        </section>
      </main>
    </div>

    <script src="productos-config.js"></script>
    <script src="catalogo.js"></script>
    <script src="producto.js"></script>
  </body>
</html>
