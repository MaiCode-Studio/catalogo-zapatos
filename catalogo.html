<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaiShoes |Catálogo</title>
    <link rel="icon" href="logo.png" type="image/png">
    <meta name="description" content="Catálogo elegante de tacones y zapatillas de dama." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="sytle.css" />
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YP39BJCR0T"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-YP39BJCR0T');
    </script>
  </head>
  <body class="catalog-body">
    <div class="catalog-page">
      <header class="catalog-header">
        <div class="brand-inline">Mai Shoes</div>
        <nav class="top-nav" aria-label="Navegación del sitio">
          <a href="index.html" >Inicio</a>
          <a href="guia-tallas.html">Guía de tallas</a>
        </nav>
      </header>

      <main class="catalog-layout">
        <section class="catalog-panel">
          <div class="toolbar">
            <div class="search-box">
              <label for="searchInput">Buscar por nombre</label>
              <input id="searchInput" type="text" placeholder="Ej. Sofia, Maya, Aura..." />
            </div>
            <span class="badge" id="totalProductos">0 modelos</span>
          </div>

          <div id="catalogo" class="products-grid"></div>
        </section>

        <aside class="simulator-panel">
          <div class="simulator-card" id="simulatorCard">
            <button id="simulatorToggle" class="mobile-simulator-toggle" type="button" aria-expanded="false" aria-controls="simulatorDetails">
              Simulación
            </button>
            <div id="simulatorDetails" class="simulator-details">
              <div class="simulator-header">
              <p class="eyebrow-small">Simulación</p>
              <label class="currency-selector" for="monedaSimulacion">
                Ver precios en
                <select id="monedaSimulacion">
                  <option value="bcv">BCV</option>
                  <option value="usdt">USDT</option>
                </select>
              </label>
              <div class="simulator-totals">
                <div class="sim-total-item">
                  <span id="monedaTotalLabel">Total BCV</span>
                  <strong id="precioBvc">$0.00</strong>
                  <small>20%: <b id="reservaBcv">$0.00</b></small>
                </div>
              </div>
              </div>

              <div id="simulacionVacia" class="simulacion-vacia">Sin calzados en la simulación</div>
              <div id="simulacionLista" class="simulacion-list" aria-live="polite"></div>

              <div class="order-query">
                <button id="consultarPedido" class="consult-order-button" type="button">Comprar</button>
                <p id="consultaPedidoError" class="order-query-error" aria-live="polite"></p>
              </div>
            </div>
          </div>
        </aside>
      </main>
    </div>

    <script src="productos-config.js"></script>
    <script src="catalogo.js"></script>
    <script src="app.js"></script>
  </body>
</html>
